version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: auth-service-mysql
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-authpass}
      MYSQL_DATABASE: ${DB_NAME:-auth_service_db}
      MYSQL_USER: ${DB_USER:-authuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-authpass}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - auth-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auth-service-redis
    restart: 'no'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: auth-service-localstack
    restart: 'no'
    ports:
      - '4567:4566'
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
    networks:
      - auth-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  auth-network:
    driver: bridge
