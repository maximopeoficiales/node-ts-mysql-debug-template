version: '3.8'

services:
  # 🐘 PostgreSQL (reemplaza MySQL)
  postgres:
    image: postgres:16-alpine
    container_name: auth-service-postgres
    restart: 'no'
    environment:
      POSTGRES_USER: ${DB_USER:-authuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authpass}
      POSTGRES_DB: ${DB_NAME:-auth_service_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-authuser}']
      interval: 5s
      timeout: 3s
      retries: 5

  # 🔴 Redis (Cache & Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: auth-service-redis
    restart: 'no'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - auth-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # 🔶 LocalStack (DynamoDB)
  localstack:
    image: localstack/localstack:3.0
    container_name: auth-service-localstack
    restart: 'no'
    ports:
      - '4567:4566'
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
    networks:
      - auth-network

  # 🎨 Adminer (PostgreSQL Admin UI - opcional)
  adminer:
    image: adminer:latest
    container_name: auth-service-adminer
    restart: 'no'
    ports:
      - '8080:8080'
    networks:
      - auth-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  auth-network:
    driver: bridge
